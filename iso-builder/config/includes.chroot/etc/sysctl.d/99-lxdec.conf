# ==============================================================================
# LXDEC OS (26.11-deb13) — Kernel Tuning Profile for DBA, Data Eng & Backend
# ==============================================================================

# Prefer RAM over Swap for PostgreSQL shared_buffers & analytical workloads
vm.swappiness = 1
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.overcommit_memory = 1

# High memory map limit for columnar engines, JVM/containers & search indexes
vm.max_map_count = 1048576

# High-concurrency TCP networking with BBR congestion control
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 16384
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

